<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e1dad2">
  <title>第一场景预览｜餐馆日常</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css?v=8">
  <link rel="stylesheet" href="../css/game.css?v=5">
</head>
<body data-scene-preview="true">
  <main class="experience" id="opening-experience">
    <div class="scene" id="scene" aria-label="场景 1，点击纸团展开海报">
      <img class="ball-photo" id="ball-photo" src="../js/images/paper-ball.png" alt="一团揉皱的纸" draggable="false">
      <div class="paper-shadow" id="paper-shadow" aria-hidden="true"></div>
      <canvas class="paper-mesh" id="paper-mesh" aria-hidden="true"></canvas>
      <div class="poster" id="poster" aria-hidden="true">
        <canvas id="poster-base"></canvas>
        <canvas class="ink" id="ink-title"></canvas>
        <canvas class="ink" id="ink-small"></canvas>
        <canvas class="ink" id="ink-quotes"></canvas>
        <img class="final-original" id="final-original" alt="完整展开的原图海报" draggable="false">
      </div>
      <div class="flat-edge-blend">
        <img class="flattened-poster" id="flattened-poster" src="../js/images/poster-flat.png" alt="褶皱消退后的平铺海报" draggable="false" aria-hidden="true">
      </div>
      <div class="menu-panel" id="menu-panel" aria-hidden="true">
        <img id="menu-art" src="../js/images/poster-menu.png" alt="右侧菜单：안내（说明）、목차（目录）、더보기（更多）和 게임 시작（开始游戏）" draggable="false">
        <button class="menu-hotspot hotspot-help" data-menu="help" aria-label="안내 · 说明" disabled></button>
        <button class="menu-hotspot hotspot-chapters" data-menu="chapters" aria-label="목차 · 章节目录" disabled></button>
        <button class="menu-hotspot hotspot-more" data-menu="more" aria-label="더보기 · 关于与资料" disabled></button>
        <button class="menu-hotspot hotspot-start" data-menu="start" aria-label="게임 시작 · 开始游戏" disabled></button>
      </div>
      <button class="paper-trigger" id="paper-trigger" aria-label="点击打开纸团" disabled></button>
      <button class="menu-reveal" id="menu-reveal" aria-label="点击画面，显示右侧菜单" hidden></button>
    </div>
    <div class="controls">
      <p id="status" role="status" aria-live="polite">正在准备纸张…</p>
      <button id="replay" hidden>重新展开</button>
    </div>
    <noscript>请开启 JavaScript，以播放纸张展开动画。</noscript>
  </main>
  <main id="game-view" class="game-view" hidden>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="paper-blue" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".170 .570 .060 0 .16 .14 .47 .05 0 .29 .10 .33 .03 0 .47 0 0 0 1 0"/></filter></defs></svg>
    <header class="game-header">
      <button class="game-brand" id="game-home" aria-label="返回开场">용식당<span>Once Upon a Time in the Middle East</span></button>
      <nav class="game-tools" aria-label="阅读工具">
        <button id="game-contents">목차</button>
        <button id="game-notebook">기록</button>
        <button id="game-sound" aria-pressed="false">소리 끔</button>
        <button id="game-language">中文</button>
        <button id="game-help">안내</button>
      </nav>
    </header>
    <div class="game-status" aria-label="叙事状态">
      <p class="chapter-progress" id="chapter-progress"></p>
      <div class="state-marks" id="state-marks"></div>
    </div>
    <div class="reading-layout" id="reading-layout">
      <figure class="collage-stage" id="collage-stage">
        <span class="tape tape-top" aria-hidden="true"></span>
        <img class="collage-art" id="collage-art" src="../js/images/story/restaurant.jpg" alt="">
        <div class="collage-grain" aria-hidden="true"></div>
        <div class="collage-tag"><span id="collage-number"></span><p id="collage-chapter"></p></div>
        <div class="memory-slip" id="memory-slip" hidden><img id="memory-image" src="../js/images/story/family.jpg" alt=""><span id="memory-caption"></span></div>
        <p class="collage-quote" id="collage-quote"></p>
      </figure>
      <article class="story-sheet" id="story-sheet">
        <p class="story-meta" id="story-meta"></p>
        <h1 id="story-title" tabindex="-1"></h1>
        <div id="story-prose" class="story-prose"></div>
        <div id="story-actions" class="story-actions"></div>
        <p id="story-feedback" class="story-feedback" aria-live="polite"></p>
        <footer class="reading-footer"><button id="game-back">이전 페이지</button><span id="save-indicator">자동 저장</span></footer>
      </article>
    </div>
    <p class="game-footnote" id="game-footnote"></p>
  </main>
  <dialog id="game-dialog" class="game-dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭">×</button></div>
    <div id="dialog-content"></div>
  </dialog>
  <script src="../js/data.js?v=3"></script>
  <script src="../js/paper-motion.js?v=3"></script>
  <script src="../js/main.js?v=7"></script>
  <script src="../js/story-data.js?v=3"></script>
  <script src="../js/game.js?v=4"></script>
</body>
</html>
